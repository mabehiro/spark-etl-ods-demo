---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-pipeline-role
  namespace: spark-etl-project
rules:
  # Permissions for Spark to create/manage ConfigMaps
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "delete", "deletecollection", "watch"]
  
  # Permissions for Spark to create/manage Pods (executors)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "watch"]
  
  # Permissions to read pod logs
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  
  # Permissions for Services (if needed)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-pipeline-rolebinding
  namespace: spark-etl-project
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-pipeline-role
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-dspa
    namespace: spark-etl-project