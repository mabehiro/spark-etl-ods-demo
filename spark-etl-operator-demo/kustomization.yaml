apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spark-etl-project

resources:
  - manifests/serviceaccount-rbac.yaml
  - manifests/sparkapplication-etl.yaml
  - manifests/sparkapplication-analytics.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: spark-etl-operator-scripts
    files:
      - src/config.py
      - src/spark_runtime.py
      - src/s3_utils.py
      - src/etl_logic.py
      - src/analytics_logic.py
      - src/etl_spark_job.py
      - src/analytics_spark_job.py
      - src/notebook_wrapper.py
