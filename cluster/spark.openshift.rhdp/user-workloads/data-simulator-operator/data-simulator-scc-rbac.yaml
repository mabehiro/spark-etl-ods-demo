# Grant mysql-sa and datasimulator-sa permission to use the built-in anyuid SCC.
# Replaces: oc adm policy add-scc-to-user anyuid -z mysql-sa -n data-simulator
#           oc adm policy add-scc-to-user anyuid -z datasimulator-sa -n data-simulator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-simulator-anyuid-mysql-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: mysql-sa
    namespace: data-simulator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-simulator-anyuid-datasimulator-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: datasimulator-sa
    namespace: data-simulator
