apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: data-simulator
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: data-simulator
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "password"
  MYSQL_DATABASE: "telecom_data"
  MYSQL_USER: "telecom_user"
  MYSQL_PASSWORD: "telecom_password"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: data-simulator
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: data-simulator
data:
  my.cnf: |
    [mysqld]
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci
    default-storage-engine=InnoDB
    innodb_buffer_pool_size=256M
    max_connections=200
    tmp_table_size=64M
    max_heap_table_size=64M
    skip-log-bin
    skip-name-resolve
    bind-address=0.0.0.0
    # Fix for OpenShift case-insensitive filesystem
    lower_case_table_names=1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: data-simulator
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: data-simulator
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-sa
  namespace: data-simulator
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: data-simulator

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: data-simulator
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: data-simulator
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
        app.kubernetes.io/part-of: data-simulator
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: mysql-sa
      containers:
      - name: mysql
        image: docker.io/library/mysql:8.0
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_DATABASE
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        - name: MYSQL_INITDB_SKIP_TZINFO
          value: "1"
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/custom.cnf
          subPath: my.cnf
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
            - -uroot
            - -ppassword
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - mysql
            - -h
            - 127.0.0.1
            - -uroot
            - -ppassword
            - -e
            - SELECT 1
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: mysql-config
        configMap:
          name: mysql-config
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: data-simulator
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: data-simulator
spec:
  selector:
    app.kubernetes.io/name: mysql
  ports:
  - name: mysql
    port: 3306
    targetPort: 3306
    protocol: TCP
  type: ClusterIP
