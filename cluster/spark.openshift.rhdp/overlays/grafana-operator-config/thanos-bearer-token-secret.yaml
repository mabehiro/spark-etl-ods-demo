# Token for Thanos/Prometheus API (cluster-monitoring-view).
# Argo CD is configured to ignore this Secret's .data so a patched token is not reverted.
# One-time: set real token (avoids JSON/shell escaping issues):
#   oc create secret generic thanos-bearer-token -n grafana \
#     --from-literal=token="Bearer $(oc create token grafana -n grafana --duration=8760h)" \
#     --dry-run=client -o yaml | oc apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: thanos-bearer-token
  namespace: grafana
type: Opaque
stringData:
  token: "Bearer REPLACE_WITH_ACTUAL_TOKEN"
