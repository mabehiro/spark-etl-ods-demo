apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: main-prometheus-datasource
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: main-prometheus
    type: prometheus
    access: proxy
    editable: true
    isDefault: true
    url: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091"
    jsonData:
      httpHeaderName1: "Authorization"
      timeInterval: 5s
      tlsSkipVerify: true

