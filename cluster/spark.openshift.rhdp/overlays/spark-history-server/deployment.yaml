apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-history-server
  namespace: spark-history-server
  labels:
    app: spark-history-server
    component: spark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-history-server
  template:
    metadata:
      labels:
        app: spark-history-server
        component: spark
    spec:
      containers:
      - name: spark-history-server
        image: quay.io/opendatahub-contrib/spark:s3.3.1-h3.3.4_v0.1.1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          # Configure S3 credentials from secret (only credentials, other settings from ConfigMap)
          export SPARK_HISTORY_OPTS="-Dspark.hadoop.fs.s3a.bucket.spark-history-server.endpoint=${S3_ENDPOINT} -Dspark.hadoop.fs.s3a.bucket.spark-history-server.access.key=${S3_ACCESS_KEY} -Dspark.hadoop.fs.s3a.bucket.spark-history-server.secret.key=${S3_SECRET_KEY}"
          
          # Start history server (will read settings from /opt/spark/conf/spark-defaults.conf)
          exec /opt/spark/sbin/start-history-server.sh
        env:
        - name: SPARK_NO_DAEMONIZE
          value: "true"
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: spark-s3-credentials
              key: s3-endpoint
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: spark-s3-credentials
              key: s3-access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: spark-s3-credentials
              key: s3-secret-key
        ports:
        - name: http
          containerPort: 18080
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: 18080
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 18080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: spark-config
          mountPath: /opt/spark/conf/spark-defaults.conf
          subPath: spark-defaults.conf
      volumes:
      - name: spark-config
        configMap:
          name: spark-history-config
