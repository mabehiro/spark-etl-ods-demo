# Restrict to this cluster's user-workloads and place all apps in single project spark-etl.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-workloads
  namespace: openshift-gitops
spec:
  generators:
    - git:
        repoURL: git@github.com:mabehiro/applicationset-gitops.git
        revision: HEAD
        files:
          - path: cluster/spark.openshift.rhdp/user-workloads/*/enabled
  template:
    spec:
      project: spark-etl
