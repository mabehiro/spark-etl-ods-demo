apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: spark-etl
  namespace: openshift-gitops
spec:
  description: User workloads (spark-etl, data-simulator, etc.) for spark.openshift.rhdp — one project, multiple apps
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
